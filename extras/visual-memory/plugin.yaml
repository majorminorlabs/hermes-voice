name: hermes-visual-memory
version: "0.3.0"
description: >-
  Your agent remembers what a camera saw on your desk: "what's in front of you?", "what did I take
  away?", "where did I last see my keys?". Built for an Echo Show running Hermes Eye; before/after
  pictures go on its screen.
author: majorminorlabs
manifest_version: 2
api_version: 1
license: MIT
homepage: https://github.com/majorminorlabs/hermes-voice/tree/main/extras/visual-memory
tags: [camera, vision, memory, echo-show, home]
requires_hermes: ">=0.23.0"
provides_tools:
  - visual_memory
  - what_changed
  - find_object
  - describe_scene
  - object_history
  - show_evidence
  - forget_visual_memory
requires_env:
  - name: EYE_TOKEN
    description: "Hermes Eye's token (shown by the Hermes Eye app on the Echo Show)"
    url: "https://github.com/majorminorlabs/hermes-voice/blob/main/docs/eye.md"
    secret: true
config_schema:
  eye_url:
    type: str
    default: ""
    required: true
    description: "Hermes Eye on the Echo Show, e.g. http://192.168.1.50:28940"
  vision:
    type: str
    default: "hermes"
    description: >-
      "hermes": the model Hermes routes the visual_memory task to (your vision model unless you pin
      another under auxiliary.visual_memory). "local": an OpenAI-compatible server below (Ollama, LM Studio).
  local_url:
    type: str
    default: "http://127.0.0.1:11434/v1"
    description: "With vision = local: the server's OpenAI-compatible URL"
  local_model:
    type: str
    default: ""
    description: "With vision = local: the vision model, e.g. qwen3.6:35b-a3b"
  local_quick_model:
    type: str
    default: ""
    description: "With vision = local: a quicker model for looks someone is waiting for (empty: the same)"
  retention_days:
    type: float
    default: 14
    description: "Pictures are deleted after this many days"
  history_days:
    type: float
    default: 90
    description: "Observations (text) are deleted after this many days"
  api_port:
    type: int
    default: 28950
    description: "The tools' API, on 127.0.0.1 only"
  display_port:
    type: int
    default: 28951
    description: "The feed the Echo's screen reads (restricted by client IP and screen origin)"
  display_allow:
    type: list
    default: []
    description: "Extra addresses allowed to read the display feed (default: the Echo from eye_url)"
  display_origin:
    type: str
    default: ""
    description: "Exact Home Assistant screen origin (default: HTTP port 8123 on the feed's local IP)"
  mirror_for_user:
    type: bool
    default: true
    description: "Say positions and show pictures as the user sees them, facing the camera"
  quick_wait:
    type: float
    default: 9
    description: "How long a question waits for its look before answering on the screen instead"
  look_when_settled:
    type: str
    default: "auto"
    description: "Also look whenever the desk settles after a change (auto: only with a local model)"
  manual_per_hour:
    type: int
    default: 20
    description: "At most this many looks an hour (0: no limit)"
